<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medienmonitoring</title>
<style>
  /* Farben angelehnt an das Erscheinungsbild der Stadt Winterthur (Schwarz-Rot) */
  :root {
    --red: #e30613;
    --red-dark: #b8000e;
    --red-soft: #fdecee;
    --black: #111111;
    --grey-900: #2b2b2b;
    --grey-600: #6b6b6b;
    --grey-300: #d9d9d9;
    --grey-100: #f4f4f4;
    --white: #ffffff;
    --radius: 6px;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--grey-100); color: var(--black);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.45;
  }

  /* Kopfzeile */
  header { background: var(--black); color: var(--white); border-bottom: 4px solid var(--red); }
  .header-inner { max-width: 1080px; margin: 0 auto; padding: 18px 24px; display: flex; align-items: center; gap: 16px; }
  .mark { width: 10px; height: 38px; background: var(--red); }
  .brand small { display: block; color: #bdbdbd; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .brand strong { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .header-inner .me { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #bdbdbd; }
  .me input { font: inherit; color: var(--white); background: #2b2b2b; border: 1px solid #444; border-radius: var(--radius);
    padding: 7px 10px; width: 170px; }
  .me input:focus { outline: 2px solid var(--red); border-color: var(--red); }

  main { max-width: 1080px; margin: 0 auto; padding: 28px 24px 60px; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 2px solid var(--grey-300); }
  .tab { background: none; color: var(--grey-600); border-radius: 0; padding: 10px 16px; font-weight: 600;
    border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .tab:hover { background: none; color: var(--black); }
  .tab.active { color: var(--black); border-bottom-color: var(--red); }
  .hidden { display: none !important; }

  /* Kennzahlen */
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
  .kpi { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 20px; border-top: 3px solid var(--black); }
  .kpi.accent { border-top-color: var(--red); }
  .kpi .num { font-size: 30px; font-weight: 700; line-height: 1.1; }
  .kpi .lbl { color: var(--grey-600); font-size: 13px; }

  /* Werkzeugleiste */
  .toolbar { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 14px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar input[type=search], .toolbar select {
    font: inherit; padding: 9px 12px; border: 1px solid var(--grey-300); border-radius: var(--radius); background: var(--white); }
  .toolbar input[type=search] { flex: 1; min-width: 200px; }
  .toolbar input:focus, .toolbar select:focus { outline: 2px solid var(--red); outline-offset: -1px; border-color: var(--red); }
  .check { display: flex; align-items: center; gap: 6px; color: var(--grey-900); font-size: 14px; cursor: pointer; }
  .check input { accent-color: var(--red); width: 16px; height: 16px; }
  button { font: inherit; font-weight: 600; background: var(--red); color: var(--white); border: none;
    border-radius: var(--radius); padding: 9px 18px; cursor: pointer; transition: background .15s; }
  button:hover { background: var(--red-dark); }
  button:disabled { background: var(--grey-300); color: var(--grey-600); cursor: default; }

  /* Status */
  .status { font-size: 13px; color: var(--grey-600); margin: 4px 2px 16px; display: flex; align-items: center; gap: 8px; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--grey-300); }
  .status.ok::before { background: #2e9e4f; }
  .status.warn::before { background: #f0a000; }
  .status.busy::before { background: var(--red); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .note { background: #fff8e1; border-left: 4px solid #f0a000; padding: 10px 14px; border-radius: var(--radius); font-size: 13px; margin-bottom: 14px; }

  /* Artikelkarten */
  #results, #ranking { display: grid; gap: 10px; }
  .card { display: flex; flex-wrap: wrap; gap: 0 14px; align-items: center; background: var(--white); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 12px 18px 12px 12px; border-left: 4px solid transparent;
    transition: transform .12s, box-shadow .12s; }
  .card:hover { transform: translateY(-1px); box-shadow: 0 2px 4px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.08); }
  .card.prio { border-left-color: var(--red); }
  .card-body { flex: 1 1 0; min-width: 0; text-decoration: none; color: inherit; }
  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 12px; }
  .source { font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--grey-900); }
  .badge { background: var(--red-soft); color: var(--red-dark); font-weight: 600; padding: 1px 8px; border-radius: 10px; }
  .time { margin-left: auto; color: var(--grey-600); }
  .card-title { font-size: 17px; font-weight: 600; line-height: 1.35; }
  .card-body:hover .card-title { color: var(--red-dark); }
  .empty { background: var(--white); border-radius: var(--radius); padding: 28px; text-align: center; color: var(--grey-600); }
  #failed { color: var(--red-dark); font-size: 13px; margin-top: 18px; }

  /* GIF-Reaktion beim Abstimmen: fährt in der Karte von unten hoch und wieder runter */
  .reaction { flex-basis: 100%; display: flex; justify-content: center; overflow: hidden;
    max-height: 0; opacity: 0; transform: translateY(40px);
    transition: max-height .5s ease, opacity .4s ease, transform .5s ease; }
  .reaction.show { max-height: 260px; opacity: 1; transform: translateY(0); }
  .reaction img { width: auto; height: auto; max-width: 100%; max-height: 230px; border-radius: 8px; margin-top: 10px; }

  /* Abstimmen */
  .vote { display: flex; flex-direction: column; align-items: center; width: 44px; flex-shrink: 0; }
  .vote button { background: none; color: var(--grey-600); padding: 2px 8px; font-size: 16px; line-height: 1; border-radius: 4px; }
  .vote button:hover { background: var(--grey-100); color: var(--black); }
  .vote button.up.on { color: #2e9e4f; }
  .vote button.down.on { color: var(--red); }
  .vote button:disabled { background: none; color: var(--grey-300); cursor: not-allowed; }
  .vote .score { font-weight: 700; font-size: 15px; }
  .vote .score.pos { color: #2e9e4f; }
  .vote .score.neg { color: var(--red); }
  .voters { color: var(--grey-600); font-size: 12px; margin-top: 4px; }
  .rank { font-size: 20px; font-weight: 700; color: var(--grey-300); width: 28px; text-align: right; flex-shrink: 0; }

  /* Tastatur-Fokus sichtbar */
  button:focus-visible, .card-body:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  /* Touch-Geräte: Abstimm-Buttons mindestens 44 x 44 px */
  @media (pointer: coarse) {
    .vote { width: 56px; }
    .vote button { min-width: 44px; min-height: 44px; font-size: 18px; }
  }
  /* Wenig Bewegung gewünscht: keine Animationen */
  @media (prefers-reduced-motion: reduce) {
    .reaction, .card { transition: none; }
    .reaction { transform: none; }
    .status.busy::before { animation: none; }
  }

  footer { text-align: center; color: var(--grey-600); font-size: 12px; padding: 0 24px 30px; }

  @media (max-width: 640px) {
    .kpis { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .kpi { padding: 12px; }
    .kpi .num { font-size: 22px; }
    .card-title { font-size: 16px; }
    .header-inner { flex-wrap: wrap; }
    .header-inner .me { margin-left: 0; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="mark"></div>
    <div class="brand">
      <small>Medienmonitoring</small>
      <strong id="org">Stadt Winterthur</strong>
    </div>
    <label class="me">Ihr Name <input id="myName" placeholder="z. B. Res Nobs" maxlength="40"></label>
  </div>
</header>

<main>
  <div id="fbNote" class="note hidden"></div>

  <nav class="tabs">
    <button class="tab active" data-tab="news">News</button>
    <button class="tab" data-tab="ranking">Team-Ranking</button>
  </nav>

  <!-- ===== Ansicht 1: News ===== -->
  <section id="view-news">
    <section class="kpis">
      <div class="kpi accent"><div class="num" id="kpiTotal">–</div><div class="lbl">Artikel</div></div>
      <div class="kpi accent"><div class="num" id="kpiPrio">–</div><div class="lbl">aus Prioritätsquellen</div></div>
      <div class="kpi"><div class="num" id="kpiVoted">–</div><div class="lbl">vom Team bewertet</div></div>
    </section>

    <section class="toolbar">
      <input type="search" id="filter" aria-label="Ergebnisse filtern" placeholder="Ergebnisse filtern, z. B. Stadtwerk oder NZZ …">
      <select id="days" aria-label="Zeitraum">
        <option value="1">Letzte 24 Stunden</option>
        <option value="3">Letzte 3 Tage</option>
        <option value="7">Letzte 7 Tage</option>
      </select>
      <select id="sort" aria-label="Sortierung">
        <option value="prio">Sortierung: Quelle &amp; Zeit</option>
        <option value="votes">Sortierung: Team-Bewertung</option>
      </select>
      <label class="check"><input type="checkbox" id="full"> Kontextbegriffe</label>
      <button id="refresh">Aktualisieren</button>
    </section>

    <div id="status" class="status">Lade …</div>
    <div id="results"></div>
    <div id="failed"></div>
  </section>

  <!-- ===== Ansicht 2: Team-Ranking ===== -->
  <section id="view-ranking" class="hidden">
    <div class="status ok" id="rankingInfo">Alle bewerteten Artikel im gewählten Zeitraum, sortiert nach Stimmen.</div>
    <div id="ranking"></div>
  </section>
</main>

<footer>Quelle: Bing News · Es werden nur Schlagzeilen angezeigt; die Artikel öffnen sich beim jeweiligen Medium. · <span id="ver"></span></footer>

<script type="module">
// ---------------------------------------------------------------------
// Sicherheitsnetz: Fehler werden gesammelt (für Tests: window.__errors muss leer bleiben)
// ---------------------------------------------------------------------
window.__errors = [];
window.addEventListener("error", e => { window.__errors.push(String(e.message || e.error)); console.error(e.message || e.error); });
window.addEventListener("unhandledrejection", e => { window.__errors.push(String(e.reason?.message || e.reason)); console.error(e.reason); });

// =====================================================================
// EINSTELLUNGEN – hier Suchbegriffe und Quellen anpassen
// =====================================================================
const APP_VERSION = "3.0";                 // wird im Footer angezeigt: so sieht man, welche Datei live ist
const FEATURES = { gifReactions: true };   // false = GIFs aus, alles andere bleibt unverändert
const CONFIG = {
  organisation: "Stadt Winterthur",
  context_word: "Winterthur",

  // Zählen immer
  direct_terms: [
    "Stadt Winterthur", "Stadtwerk Winterthur", "Stadtpolizei Winterthur",
    "Stapo Winterthur", "Stadtrat Winterthur", "Winterthurer Stadtrat",
    "Stadtparlament Winterthur", "Winterthurer Stadtpräsident", "Stadtbus Winterthur",
    "Stadtgrün Winterthur", "Schutz & Intervention Winterthur", "Feuerwehr Winterthur",
    "Winterthurer Bibliotheken", "Winterthurer Schulpflege"
  ],

  // Zählen nur zusammen mit "Winterthur" (nur wenn Häkchen gesetzt)
  context_terms: [
    "Stadtwerk", "Stadtpolizei", "Stapo", "Stadtbus", "Stadtrat", "Stadtparlament",
    "Stadtkanzlei", "Departement Präsidiales", "Departement Finanzen",
    "Departement Bau und Mobilität", "Departement Sicherheit und Umwelt",
    "Departement Schule und Sport", "Departement Soziales", "Departement Technische Betriebe",
    "Amt für Stadtentwicklung", "Amt für Kultur", "Personalamt", "Finanzamt", "Steueramt",
    "Informatikdienste", "Amt für Baubewilligungen", "Amt für Städtebau", "Tiefbauamt",
    "Stadtrichteramt", "Umwelt- und Gesundheitsschutz", "Schulamt", "Sportamt",
    "Soziale Dienste", "Alter und Pflege", "Zivilschutz", "Stadtarchiv", "KESB",
    "Kindes- und Erwachsenenschutzbehörde", "Sozialhilfebehörde", "Ombudsstelle",
    "Datenschutzstelle", "Finanzkontrolle", "Friedensrichteramt", "Stadtammannamt",
    "Betreibungsamt"
  ],

  // Diese Quellen werden zuerst angezeigt
  priority_sources: [
    "landbote.ch", "nzz.ch", "tagesanzeiger.ch", "srf.ch", "20min.ch", "watson.ch",
    "blick.ch", "nau.ch", "zueritoday.ch", "toponline.ch", "inside-it.ch", "netzwoche.ch"
  ],

  days_back: 7
};

// Eigener Mini-Proxy (Cloudflare Worker), der Bing News abfragt
const WORKER_URL = "https://winti-news.res-nobs.workers.dev/";

// ---------------------------------------------------------------------
// FIREBASE – Verbindung zum Projekt "winti-medienschau"
// ---------------------------------------------------------------------
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD-k-0Cy1-ZUYYvkgKPIidphFporYZaDco",
  authDomain: "winti-medienschau.firebaseapp.com",
  projectId: "winti-medienschau",
  storageBucket: "winti-medienschau.firebasestorage.app",
  messagingSenderId: "942108559475",
  appId: "1:942108559475:web:ab271583a7d831caf88206"
};

// So lange wartet die Suche maximal (Sekunden)
const DEADLINE_SECONDS = 15;

// Ergebnisse werden so lange im Browser gespeichert (in Minuten)
const CACHE_MINUTES = 30;

// GIF-Reaktionen beim Abstimmen (Dateien im Ordner "gifs" im Repository)
const GIF_UP = "gifs/Eyt8eq.gif";
const GIF_DOWN = "gifs/yougotthis-beyonce.gif";
const GIF_SECONDS = 3.5;   // so lange bleibt das GIF sichtbar
// =====================================================================

// Firebase wird erst in startFirebase() geladen (feste Version). Ist das Netz blockiert,
// funktioniert die News-Suche trotzdem; nur das Abstimmen ist dann nicht verfügbar.
const FIREBASE_BASE = "https://www.gstatic.com/firebasejs/10.12.2/";
let FS = null;   // Firestore-Funktionen, sobald geladen

// Browser-Speicher geschützt (privates Fenster / blockierter oder voller Speicher)
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
};

// Nur http(s)-Links zulassen (Schutz vor javascript:-Adressen aus Fremddaten)
function safeUrl(u) {
  try {
    const x = new URL(u);
    return (x.protocol === "http:" || x.protocol === "https:") ? x.href : "#";
  } catch (e) { return "#"; }
}

const $ = id => document.getElementById(id);
$("ver").textContent = "Version " + APP_VERSION;

$("org").textContent = CONFIG.organisation;
document.title = "Medienmonitoring " + CONFIG.organisation;
$("days").value = String(CONFIG.days_back);

// =====================================================================
// TEIL A: Team-Abstimmung mit Firebase
// =====================================================================

// Stimmen werden pro Artikel gespeichert (Sammlung "votes").
// Geladen werden alle Artikel, die in den letzten MAX_DAYS Tagen erschienen sind.
const MAX_DAYS = 7;

let db = null;
let myId = null;        // anonyme Kennung dieses Browsers
let votesAll = {};      // Artikel-ID -> Daten aus Firebase (letzte 7 Tage)

// Name im Browser merken
$("myName").value = store.get("newsmonitor_name") || "";
$("myName").addEventListener("input", () => {
  store.set("newsmonitor_name", $("myName").value.trim());
  refreshViews();
});
const myName = () => $("myName").value.trim();

function showNote(text) {
  $("fbNote").textContent = text;
  $("fbNote").classList.toggle("hidden", !text);
}

// Eindeutige, kurze ID pro Artikel (aus dem Link berechnet)
function articleId(a) {
  if (a.id) return a.id;
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (const ch of a.link || a.title) {
    const c = ch.charCodeAt(0);
    h1 = Math.imul(h1 ^ c, 2654435761);
    h2 = Math.imul(h2 ^ c, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(36) + (h1 >>> 0).toString(36);
}

function scoreOf(id) {
  const v = votesAll[id]?.votes || {};
  return Object.values(v).reduce((sum, x) => sum + x, 0);
}

function myVote(id) {
  return votesAll[id]?.votes?.[myId] || 0;
}

async function startFirebase() {
  try {
    const [appMod, authMod, fsMod] = await Promise.all([
      import(FIREBASE_BASE + "firebase-app.js"),
      import(FIREBASE_BASE + "firebase-auth.js"),
      import(FIREBASE_BASE + "firebase-firestore.js")
    ]);
    const { initializeApp } = appMod;
    const { getAuth, signInAnonymously, onAuthStateChanged } = authMod;
    FS = fsMod;
    const app = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);
    db = FS.getFirestore(app);

    onAuthStateChanged(auth, user => {
      if (!user) return;
      myId = user.uid;
      showNote("");
      // Live-Verbindung: jede Stimme im Team erscheint sofort bei allen
      const since = new Date(Date.now() - MAX_DAYS * 24 * 60 * 60 * 1000).toISOString();
      FS.onSnapshot(FS.query(FS.collection(db, "votes"), FS.where("published", ">=", since)), snap => {
        votesAll = {};
        snap.forEach(d => votesAll[d.id] = d.data());
        refreshViews();
      }, err => showNote("Firebase-Fehler beim Lesen: " + err.message));
    });

    await signInAnonymously(auth);
  } catch (e) {
    db = null;
    showNote("Firebase-Anmeldung fehlgeschlagen: " + e.message);
    refreshViews();
  }
}

// Stimme abgeben: +1 oder -1. Nochmals klicken nimmt die Stimme zurück.
async function vote(a, value) {
  if (!db || !myId || !FS) return false;
  if (!myName()) {
    alert("Bitte oben rechts zuerst Ihren Namen eingeben.");
    $("myName").focus();
    return false;
  }
  const id = articleId(a);
  const remove = myVote(id) === value;
  try {
    await FS.setDoc(FS.doc(db, "votes", id), {
      title: a.title,
      link: a.link,
      source: a.source,
      sourceUrl: a.sourceUrl || "",
      published: a.date.toISOString(),
      votes: { [myId]: remove ? FS.deleteField() : value },
      names: { [myId]: remove ? FS.deleteField() : myName() }
    }, { merge: true });
    return true;
  } catch (e) {
    showNote("Stimme konnte nicht gespeichert werden: " + e.message);
    return false;
  }
}

// ---------------------------------------------------------------------
// GIF-Reaktion
// Nach jeder Stimme zeichnet Firebase alle Karten neu. Darum merken wir uns pro Artikel,
// welches GIF gerade läuft, und bauen es in der neuen Karte wieder auf.
// ---------------------------------------------------------------------
const SLIDE_MS = 600;           // Dauer der Hoch-/Runter-Animation
const reactions = new Map();    // Artikel-ID -> { gif, alt, start, timer }

const canVote = () => !!(db && myId && FS && myName());

function reactionBoxes(id) {
  return document.querySelectorAll('.card[data-id="' + id + '"] .reaction');
}

function slideIn(box, gif, alt) {
  const img = box.querySelector("img");
  img.alt = alt;
  img.src = gif;
  box.classList.remove("show");
  void box.offsetWidth;                                   // Startzustand festschreiben
  const token = box._token = {};                          // wird von endReaction() ungültig gemacht
  requestAnimationFrame(() => requestAnimationFrame(() => { if (box._token === token) box.classList.add("show"); }));
}

function playReaction(id, gif, alt) {
  if (!FEATURES.gifReactions) return;
  const old = reactions.get(id);
  if (old) clearTimeout(old.timer);
  reactions.set(id, { gif, alt, start: Date.now(), timer: setTimeout(() => endReaction(id), GIF_SECONDS * 1000) });
  reactionBoxes(id).forEach(box => slideIn(box, gif, alt));
}

function endReaction(id) {
  const r = reactions.get(id);
  if (!r) return;
  clearTimeout(r.timer);
  reactions.delete(id);
  reactionBoxes(id).forEach(box => {
    box._token = null;                                    // ein noch ausstehendes Einblenden abbrechen
    box.classList.remove("show");                         // fährt wieder nach unten weg
    setTimeout(() => {
      if (!box.classList.contains("show")) box.querySelector("img").removeAttribute("src");
    }, SLIDE_MS);
  });
}

// GIF-Bereich einer Karte; läuft für diesen Artikel gerade ein GIF, wird es weitergeführt
function reactionBox(id) {
  const box = document.createElement("div");
  box.className = "reaction";
  const img = document.createElement("img");
  img.alt = "";
  box.append(img);
  const r = reactions.get(id);
  if (r) {
    if (Date.now() - r.start < SLIDE_MS) slideIn(box, r.gif, r.alt);   // Animation läuft noch: neu starten
    else { img.alt = r.alt; img.src = r.gif; box.classList.add("show"); }
  }
  return box;
}

// Stimme abgeben; GIF sofort zeigen, aber nur wenn die Stimme wirklich abgegeben (nicht zurückgenommen) wird
function onVote(a, value, gif, alt) {
  const id = articleId(a);
  const adding = canVote() && myVote(id) !== value;
  if (adding) playReaction(id, gif, alt);
  vote(a, value).then(ok => { if (!ok && adding) endReaction(id); });
}

// Die Abstimm-Spalte (▲ Zahl ▼) für eine Karte bauen
function voteBox(a) {
  const id = articleId(a);
  const box = document.createElement("div");
  box.className = "vote";
  const up = document.createElement("button");
  up.className = "up" + (myVote(id) === 1 ? " on" : "");
  up.textContent = "▲";
  up.title = "Relevant";
  up.setAttribute("aria-label", "Relevant");
  up.setAttribute("aria-pressed", myVote(id) === 1 ? "true" : "false");
  const score = document.createElement("div");
  const s = scoreOf(id);
  score.className = "score" + (s > 0 ? " pos" : s < 0 ? " neg" : "");
  score.textContent = s;
  const down = document.createElement("button");
  down.className = "down" + (myVote(id) === -1 ? " on" : "");
  down.textContent = "▼";
  down.title = "Nicht relevant";
  down.setAttribute("aria-label", "Nicht relevant");
  down.setAttribute("aria-pressed", myVote(id) === -1 ? "true" : "false");
  up.disabled = down.disabled = !(db && myId);
  up.onclick = () => onVote(a, 1, GIF_UP, "Reaktion: relevant");
  down.onclick = () => onVote(a, -1, GIF_DOWN, "Reaktion: nicht relevant");
  box.append(up, score, down);
  return box;
}

function voterLine(id) {
  const data = votesAll[id];
  if (!data?.votes) return "";
  return Object.entries(data.votes)
    .map(([uid, v]) => (v > 0 ? "▲ " : "▼ ") + (data.names?.[uid] || "Unbekannt"))
    .join(" · ");
}

// =====================================================================
// TEIL B: News suchen (über den eigenen Worker bei Bing News)
// =====================================================================

// Suchanfragen in Gruppen zu 3 Begriffen (Bing liefert pro Suche nur wenige Treffer)
function buildQueries(full) {
  const quote = t => '"' + t + '"';
  const queries = [];
  for (let i = 0; i < CONFIG.direct_terms.length; i += 3) {
    queries.push(CONFIG.direct_terms.slice(i, i + 3).map(quote).join(" OR "));
  }
  if (full) {
    for (let i = 0; i < CONFIG.context_terms.length; i += 3) {
      queries.push(CONFIG.context_word + " (" +
        CONFIG.context_terms.slice(i, i + 3).map(quote).join(" OR ") + ")");
    }
  }
  return queries;
}

// Bing verpackt den Artikel-Link in eine Weiterleitung; hier holen wir die echte Adresse heraus
function realUrl(bingLink) {
  try {
    return new URL(bingLink).searchParams.get("url") || bingLink;
  } catch (e) {
    return bingLink;
  }
}

async function fetchQuery(q, signal) {
  const response = await fetch(WORKER_URL + "?q=" + encodeURIComponent(q), { signal });
  if (!response.ok) throw new Error("HTTP " + response.status);
  const text = await response.text();
  if (!text.includes("<rss")) throw new Error("Keine gültige Antwort");
  const xml = new DOMParser().parseFromString(text, "text/xml");
  return [...xml.getElementsByTagName("item")].map(item => {
    const link = realUrl(item.getElementsByTagName("link")[0]?.textContent || "");
    let host = "";
    try { host = new URL(link).hostname; } catch (e) {}
    return {
      title: item.getElementsByTagName("title")[0]?.textContent || "",
      link: link,
      date: new Date(item.getElementsByTagName("pubDate")[0]?.textContent),
      source: item.getElementsByTagName("News:Source")[0]?.textContent || host,
      sourceUrl: host
    };
  }).filter(a => a.title && !isNaN(a.date.getTime()));   // Treffer ohne Titel/gültiges Datum können nicht angezeigt oder bewertet werden
}

function isPriority(a) {
  return CONFIG.priority_sources.some(p => (a.sourceUrl || "").includes(p));
}

function timeAgo(date) {
  const min = Math.round((Date.now() - date) / 60000);
  if (min < 60) return "vor " + Math.max(min, 1) + " Min.";
  const h = Math.round(min / 60);
  if (h < 24) return "vor " + h + " Std.";
  return date.toLocaleDateString("de-CH");
}

// =====================================================================
// TEIL C: Anzeige
// =====================================================================

let lastArticles = [];

function cutoffDate() {
  return Date.now() - Number($("days").value) * 24 * 60 * 60 * 1000;
}

// Eine Artikelkarte bauen (wird in beiden Ansichten verwendet)
function buildCard(a, rank) {
  const id = articleId(a);
  const card = document.createElement("div");
  card.className = "card" + (isPriority(a) ? " prio" : "");
  card.dataset.id = id;

  if (rank) {
    const r = document.createElement("div");
    r.className = "rank";
    r.textContent = rank;
    card.append(r);
  }
  card.append(voteBox(a));

  const body = document.createElement("a");
  body.className = "card-body";
  body.href = safeUrl(a.link);
  body.target = "_blank";
  body.rel = "noopener";

  const top = document.createElement("div");
  top.className = "card-top";
  const source = document.createElement("span");
  source.className = "source";
  source.textContent = a.source || "Unbekannte Quelle";
  top.append(source);
  if (isPriority(a)) {
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = "Priorität";
    top.append(badge);
  }
  const time = document.createElement("span");
  time.className = "time";
  time.textContent = timeAgo(a.date);
  time.title = a.date.toLocaleString("de-CH");
  top.append(time);

  const title = document.createElement("div");
  title.className = "card-title";
  title.textContent = a.title;
  body.append(top, title);

  const voters = voterLine(id);
  if (voters) {
    const v = document.createElement("div");
    v.className = "voters";
    v.textContent = voters;
    body.append(v);
  }

  card.append(body);
  card.append(reactionBox(id));   // GIF-Bereich unten in der Karte
  return card;
}

function render(articles) {
  lastArticles = [...articles];
  const filter = $("filter").value.trim().toLowerCase();
  const byVotes = $("sort").value === "votes";
  const cutoff = cutoffDate();
  const results = $("results");
  results.innerHTML = "";

  const inPeriod = lastArticles.filter(a => a.date.getTime() >= cutoff);
  const list = inPeriod
    .filter(a => !filter || (a.title + " " + a.source).toLowerCase().includes(filter))
    .sort((a, b) =>
      (byVotes ? scoreOf(articleId(b)) - scoreOf(articleId(a)) : 0) ||
      (isPriority(b) - isPriority(a)) || (b.date - a.date));

  $("kpiTotal").textContent = inPeriod.length;
  $("kpiPrio").textContent = inPeriod.filter(isPriority).length;
  $("kpiVoted").textContent = db ? Object.values(votesAll)
    .filter(d => Object.keys(d.votes || {}).length > 0 && new Date(d.published).getTime() >= cutoff).length : "–";

  for (const a of list) results.append(buildCard(a));

  if (list.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = inPeriod.length ? "Kein Artikel passt zum Filter."
      : lastArticles.length ? "Keine Artikel im gewählten Zeitraum (" + lastArticles.length + " ältere Treffer). Wählen Sie einen längeren Zeitraum."
      : "Keine Artikel gefunden: Die Suche hat 0 Treffer geliefert.";
    results.append(empty);
  }
}

// Team-Ranking: alle bewerteten Artikel im gewählten Zeitraum, nach Stimmen sortiert
function renderRanking() {
  const box = $("ranking");
  box.innerHTML = "";
  const days = Number($("days").value);
  const cutoff = cutoffDate();
  $("rankingInfo").textContent = "Alle bewerteten Artikel der letzten " +
    (days === 1 ? "24 Stunden" : days + " Tage") + ", sortiert nach Stimmen. Aktualisiert sich live.";

  const list = Object.entries(votesAll)
    .filter(([id, d]) => Object.keys(d.votes || {}).length > 0 && new Date(d.published).getTime() >= cutoff)
    .map(([id, d]) => ({
      id, title: d.title, link: d.link, source: d.source, sourceUrl: d.sourceUrl,
      date: new Date(d.published)
    }))
    .sort((a, b) => scoreOf(b.id) - scoreOf(a.id) || b.date - a.date);

  list.forEach((a, i) => box.append(buildCard(a, i + 1)));

  if (list.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = db ? "In diesem Zeitraum wurde noch kein Artikel bewertet." : "Abstimmen ist noch nicht aktiv.";
    box.append(empty);
  }
}

function refreshViews() {
  render(lastArticles);
  renderRanking();
}

// Tabs umschalten
document.querySelectorAll(".tab").forEach(tab => tab.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab));
  $("view-news").classList.toggle("hidden", tab.dataset.tab !== "news");
  $("view-ranking").classList.toggle("hidden", tab.dataset.tab !== "ranking");
}));

// =====================================================================
// TEIL D: Zwischenspeicher und Suchablauf
// =====================================================================

// Gespeichert werden immer alle Treffer; der Zeitraum wird erst bei der Anzeige gefiltert
function cacheKey() {
  return "newsmonitor_v2_" + $("full").checked;
}

function showStatus(time, failedCount, total, fromCache) {
  const status = $("status");
  status.className = "status" + (failedCount ? " warn" : " ok");
  status.textContent = "Stand " + new Date(time).toLocaleString("de-CH", { dateStyle: "short", timeStyle: "short" }) +
    (fromCache ? " · aus Zwischenspeicher" : "") +
    (failedCount ? " · " + failedCount + " von " + total + " Suchen ohne Antwort" : "");
}

function loadCache() {
  try {
    const data = JSON.parse(store.get(cacheKey()) || "null");
    if (!data || typeof data.time !== "number" || !Array.isArray(data.articles)) return null;
    data.articles = data.articles
      .filter(a => a && typeof a.title === "string")
      .map(a => ({ ...a, date: new Date(a.date) }))
      .filter(a => !isNaN(a.date.getTime()));
    return data.articles.length ? data : null;   // leere oder kaputte Daten nie anzeigen
  } catch (e) {
    return null;
  }
}

function showOrSearch() {
  const data = loadCache();
  if (data) {
    $("failed").textContent = "";
    render(data.articles);
    showStatus(data.time, 0, 0, true);
    if (Date.now() - data.time < CACHE_MINUTES * 60 * 1000) return;
  }
  run();
}

async function run() {
  const queries = buildQueries($("full").checked);
  const button = $("refresh");
  const status = $("status");
  const articles = new Map();
  const failed = [];
  let done = 0;

  const previous = loadCache();
  button.disabled = true;
  $("failed").textContent = "";
  status.className = "status busy";
  status.textContent = "Suche läuft …";

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), DEADLINE_SECONDS * 1000);

  await Promise.all(queries.map(async q => {
    // Bei Fehler einmal kurz erneut versuchen
    for (let attempt = 1; attempt <= 2; attempt++) {
      try {
        for (const a of await fetchQuery(q, controller.signal)) {
          if (!articles.has(a.link)) articles.set(a.link, a);
        }
        break;
      } catch (e) {
        if (attempt === 2 || controller.signal.aborted) { failed.push(q); break; }
        await new Promise(r => setTimeout(r, 800));
      }
    }
    done++;
    if (articles.size > 0 || !previous) render(articles.values());
    status.textContent = "Suche läuft … (" + done + " von " + queries.length + " fertig)";
  }));
  clearTimeout(timer);

  const list = [...articles.values()];
  if (list.length > 0) {
    store.set(cacheKey(), JSON.stringify({ time: Date.now(), articles: list }));
    render(list);
  } else if (previous) {
    render(previous.articles);  // Suche fehlgeschlagen: alte Ergebnisse behalten
  } else {
    render([]);
  }
  showStatus(Date.now(), failed.length, queries.length, false);
  if (list.length === 0 && failed.length === 0) {
    $("failed").textContent = "Hinweis: Alle " + queries.length + " Suchen wurden vom Worker beantwortet, enthielten aber 0 Treffer.";
  }
  if (failed.length) {
    $("failed").textContent = "Ohne Antwort (nochmals «Aktualisieren» klicken): " + failed.join("  |  ");
  }
  button.disabled = false;
}

$("refresh").addEventListener("click", run);
$("filter").addEventListener("input", () => render(lastArticles));
$("sort").addEventListener("change", () => render(lastArticles));
$("days").addEventListener("change", refreshViews);   // Zeitraum filtert nur die Anzeige – keine neue Suche nötig
$("full").addEventListener("change", showOrSearch);

startFirebase();
showOrSearch();
</script>
