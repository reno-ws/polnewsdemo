<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medienmonitoring</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 24px; margin-bottom: 4px; }
  .bar { display: flex; gap: 10px; align-items: center; margin: 16px 0; flex-wrap: wrap; }
  select, button { font-size: 14px; padding: 6px 10px; }
  button { background: #1a3e8c; color: white; border: none; border-radius: 4px; cursor: pointer; }
  #status { color: #666; font-size: 14px; margin-bottom: 16px; }
  .item { padding: 12px 14px; border-bottom: 1px solid #eee; }
  .item.prio { background: #f5f7ff; }
  .item a { font-size: 16px; color: #1a3e8c; text-decoration: none; }
  .item a:hover { text-decoration: underline; }
  #failed { color: #a33; font-size: 13px; margin-top: 20px; }
  .meta { color: #777; font-size: 13px; margin-top: 4px; }
</style>
</head>
<body>

<h1 id="title">Medienmonitoring</h1>

<div class="bar">
  <label>Zeitraum:
    <select id="days">
      <option value="1">Letzte 24 Stunden</option>
      <option value="3">Letzte 3 Tage</option>
      <option value="7">Letzte 7 Tage</option>
    </select>
  </label>
  <button id="refresh">Aktualisieren</button>
</div>

<div id="status">Lade …</div>
<div id="results"></div>
<div id="failed"></div>

<script>
// Hilfsdienste ("Proxys"), über die der Browser Google News abrufen darf.
const PROXIES = [
  url => "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
  url => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(url)
];

let config = null;

// 1) Einstellungen aus config.json laden
async function loadConfig() {
  const response = await fetch("config.json", { cache: "no-store" });
  config = await response.json();
  document.getElementById("title").textContent = "Medienmonitoring " + config.organisation;
  document.title = "Medienmonitoring " + config.organisation;
  document.getElementById("days").value = String(config.days_back);
}

// 2) Suchanfragen bilden
function buildQueries() {
  const queries = [];
  const direct = config.direct_terms.map(t => '"' + t + '"');
  for (let i = 0; i < direct.length; i += 6) {
    queries.push(direct.slice(i, i + 6).join(" OR "));
  }
  // Kontextbegriffe in kleineren Gruppen (3), weil diese Suchen viele Treffer liefern
  const context = config.context_terms.map(t => '"' + t + '"');
  for (let i = 0; i < context.length; i += 3) {
    queries.push(config.context_word + " (" + context.slice(i, i + 3).join(" OR ") + ")");
  }
  return queries;
}

// 3) Eine Suchanfrage bei Google News Schweiz ausführen.
// Alle Proxys werden gleichzeitig gefragt; die schnellste Antwort gewinnt.
// Nach 20 Sekunden wird abgebrochen, damit nichts ewig hängt.
const TIMEOUT_MS = 20000;

async function fetchViaProxy(proxy, url) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
  try {
    const response = await fetch(proxy(url), { signal: controller.signal });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const text = await response.text();
    if (!text.includes("<rss")) throw new Error("Keine gültige Antwort");
    return text;
  } finally {
    clearTimeout(timer);
  }
}

async function fetchQuery(query, days) {
  const url = "https://news.google.com/rss/search?q=" +
    encodeURIComponent(query + " when:" + days + "d") + "&hl=de&gl=CH&ceid=CH:de";
  const text = await Promise.any(PROXIES.map(p => fetchViaProxy(p, url)));
  const xml = new DOMParser().parseFromString(text, "text/xml");
  return [...xml.querySelectorAll("item")].map(item => {
    const source = item.querySelector("source");
    return {
      title: item.querySelector("title")?.textContent || "",
      link: item.querySelector("link")?.textContent || "",
      date: new Date(item.querySelector("pubDate")?.textContent),
      source: source ? source.textContent : "",
      sourceUrl: source ? source.getAttribute("url") || "" : ""
    };
  });
}

function isPriority(article) {
  return config.priority_sources.some(p => article.sourceUrl.includes(p));
}

// 4) Ergebnisliste anzeigen
function render(articles) {
  const results = document.getElementById("results");
  results.innerHTML = "";
  const list = [...articles.values()].sort((a, b) =>
    (isPriority(b) - isPriority(a)) || (b.date - a.date));

  for (const a of list) {
    const div = document.createElement("div");
    div.className = "item" + (isPriority(a) ? " prio" : "");

    const link = document.createElement("a");
    link.href = a.link;
    link.target = "_blank";
    link.textContent = a.title;

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = (isPriority(a) ? "★ " : "") + a.source + " · " +
      a.date.toLocaleString("de-CH", { dateStyle: "short", timeStyle: "short" });

    div.append(link, meta);
    results.append(div);
  }
  return list.length;
}

// 5) Eine Suche bis zu 3-mal versuchen, mit kurzer Pause dazwischen
const MAX_ATTEMPTS = 3;
const PARALLEL = 4;  // höchstens 4 Suchen gleichzeitig, damit die Proxys nicht überlastet werden

const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

async function fetchWithRetry(query, days) {
  for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
    try {
      return await fetchQuery(query, days);
    } catch (e) {
      if (attempt === MAX_ATTEMPTS) throw e;
      await wait(1500 * attempt);
    }
  }
}
